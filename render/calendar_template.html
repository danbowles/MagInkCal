<html>

<head>
    <link rel="stylesheet" href="fonts.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>

    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body class="bg-white text-einkBlack font-quattro w-[1304px] h-[984px] overflow-hidden">
    <div class="flex flex-col h-full">

        <!-- HEADER -->
        <div class="flex justify-between items-start mb-3 p-3">
            <!-- Date -->
            <div class="leading-tight">
                <div class="text-3xl font-bold">{month_year}</div>
                <div class="text-2xl">{weekday_day}</div>
            </div>

            <!-- Legend -->
            <div class="flex space-x-6 items-center text-xl font-bold">{legendHtml}</div>

            <!-- Battery -->
            <div class="relative w-8 h-3 border border-einkBlack rounded-md">
                <div class="absolute top-0 left-0 h-full bg-einkBlack w-[{batt_level_percent}]"></div>
            </div>
        </div>

        <!-- DAY OF WEEK HEADER -->
        <div class="grid grid-cols-7 text-center text-lg font-bold border-b border-blacks   ">
            {week_day_headers}
        </div>

        <!-- CALENDAR GRID -->
        <div class="grid grid-cols-7 grid-rows-2 text-lg grow">
            {events}
        </div>
    </div>
</body>

</html>
